name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Computes NX_BASE / NX_HEAD so `nx affected` knows the diff range
      # (works for both push and pull_request). No Nx Cloud involved.
      - uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      - run: npx nx format:check
      - run: npx nx affected -t lint test build typecheck

  # DB + running-API checks. Its own job on ubuntu-latest, which has Docker
  # (Atlas's dev database and the docker-compose stack). Runs the e2e suite.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      # .env for tools that read it (Atlas, docker-compose). docker-compose
      # defaults; nothing secret.
      - run: cp .env.example .env

      - uses: ariga/setup-atlas@v0

      # Drift check: the committed migrations must be in sync with the entities.
      # Uses `migrate diff` (Community Edition). Reviewing the generated .sql in
      # the PR is the safety gate (`migrate lint` moved to Atlas Pro in v0.38).
      - run: |
          npx nx run marginalia-api:migrate-diff -- ci_drift_check
          if [ -n "$(git status --porcelain apps/marginalia-api/src/app/database/migrations)" ]; then
            echo "::error::Entities changed without a migration. Run: nx run marginalia-api:migrate-diff -- <name>"
            git --no-pager diff apps/marginalia-api/src/app/database/migrations
            exit 1
          fi

      # e2e: bring up the stack, apply the schema, run the suite against a real
      # API process (global-setup spawns it; E2E_SKIP_INFRA lets the job own infra).
      - run: docker compose up -d --wait db mail
      - run: npx nx run marginalia-api:migrate-apply
      - run: npx nx run marginalia-api:build
      - run: E2E_SKIP_INFRA=true npx nx e2e marginalia-api-e2e
