name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # .env for tools that read it (Atlas migration checks). Values are the
      # docker-compose defaults; nothing secret.
      - run: cp .env.example .env

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: npx nx record -- npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always()

  # Atlas migrations: entities load + committed migrations are safe & in sync.
  # Runs on the main runner (has Docker for Atlas's ephemeral dev database).
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      - run: cp .env.example .env

      - uses: ariga/setup-atlas@v0

      # Fails on destructive / unsafe migrations (drops, table locks,
      # NOT NULL without default, checksum mismatch in atlas.sum).
      - run: npx nx run marginalia-api:migrate-lint

      # Fails if an entity changed but no migration was generated for it.
      - run: |
          npx nx run marginalia-api:migrate-diff -- ci_drift_check
          if [ -n "$(git status --porcelain apps/marginalia-api/src/app/database/migrations)" ]; then
            echo "::error::Entities changed without a migration. Run: nx run marginalia-api:migrate-diff -- <name>"
            git --no-pager diff apps/marginalia-api/src/app/database/migrations
            exit 1
          fi
