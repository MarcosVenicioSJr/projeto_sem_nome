# Infra local do Marginália. Sobe o Postgres (e um Adminer p/ inspecionar).
# Lê as credenciais do .env da raiz (o mesmo que o marginalia-api usa).
#
#   docker compose up -d        # sobe
#   docker compose logs -f db   # acompanha
#   docker compose down         # para (mantém o volume/dados)
#   docker compose down -v      # para e APAGA os dados

services:
  db:
    image: postgres:16-alpine
    container_name: marginalia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-marginalia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marginalia}
      POSTGRES_DB: ${DB_NAME:-marginalia}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - marginalia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-marginalia} -d ${DB_NAME:-marginalia}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: marginalia-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

  # Catcher de e-mail local: aceita SMTP em :1025 e mostra tudo em :8025.
  # Em staging/produção troque as MAIL_* para um SMTP real (ex: Mailjet).
  mail:
    image: axllent/mailpit:latest
    container_name: marginalia-mail
    restart: unless-stopped
    ports:
      - '${MAIL_PORT:-1025}:1025' # SMTP
      - '8025:8025' # UI web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

volumes:
  marginalia_pgdata:
