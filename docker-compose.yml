# Marginália local infra: Postgres + Mailpit (local email catcher).
# Reads credentials from the root .env (the same one marginalia-api uses).
#
#   docker compose up -d        # start
#   docker compose logs -f db   # follow
#   docker compose down         # stop (keeps the volume/data)
#   docker compose down -v      # stop and DELETE the data

services:
  db:
    image: postgres:16-alpine
    container_name: marginalia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-marginalia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marginalia}
      POSTGRES_DB: ${DB_NAME:-marginalia}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - marginalia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-marginalia} -d ${DB_NAME:-marginalia}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local email catcher: accepts SMTP on :1025 and shows everything on :8025.
  # In staging/prod point MAIL_* at a real SMTP (e.g. Mailjet).
  mail:
    image: axllent/mailpit:latest
    container_name: marginalia-mail
    restart: unless-stopped
    ports:
      - '${MAIL_PORT:-1025}:1025' # SMTP
      - '8025:8025' # UI web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

volumes:
  marginalia_pgdata:
